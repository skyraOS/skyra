name: Living wallpaper UI
on:
  pull_request:
    paths: ['frontend/**', 'desktop/**', '.github/workflows/living-wallpaper-ui.yml']
  push:
    branches: [feat/living-wallpaper-ui]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --test mock/client.test.mjs
  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path desktop -c release
      - run: swift test --package-path desktop
