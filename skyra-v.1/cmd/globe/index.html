<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>skyra · globe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0e14; --panel:#11151f; --ink:#c7d0e0; --dim2:#66708a;
          --cyan:#4fd8eb; --amber:#ffb347; --green:#69d58c; --red:#e06c75; --line:#1d2333; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:13px/1.5 "SF Mono", ui-monospace, Menlo, monospace;
         display:flex; height:100vh; overflow:hidden; }
  #view { flex:1; position:relative; min-width:0; }
  #view canvas { display:block; }
  #hud { position:absolute; top:14px; left:16px; pointer-events:none; }
  #hud h1 { font-size:14px; font-weight:600; letter-spacing:.12em; color:var(--cyan); }
  #hud .sub { color:var(--dim2); font-size:11px; margin-top:2px; }
  #status { position:absolute; bottom:14px; left:16px; color:var(--dim2); font-size:12px; pointer-events:none; }
  #status b { color:var(--ink); font-weight:600; }
  #panel { width:340px; background:var(--panel); border-left:1px solid var(--line);
           display:flex; flex-direction:column; overflow:hidden; }
  #panel section { padding:14px 16px; border-bottom:1px solid var(--line); }
  #panel h2 { font-size:10px; letter-spacing:.18em; color:var(--dim2); text-transform:uppercase; margin-bottom:8px; }
  #runbtn { background:none; border:1px solid var(--cyan); color:var(--cyan); font:inherit;
            padding:6px 14px; border-radius:4px; cursor:pointer; }
  #runbtn:hover { background:rgba(79,216,235,.08); }
  #runbtn:disabled { border-color:var(--dim2); color:var(--dim2); cursor:default; }
  #reps { background:var(--bg); color:var(--ink); border:1px solid var(--line); font:inherit;
          padding:5px 8px; border-radius:4px; margin-right:8px; }
  #bars { display:flex; align-items:flex-end; gap:6px; height:84px; }
  .bar { width:26px; background:var(--dim2); border-radius:2px 2px 0 0; position:relative; transition:height .4s; }
  .bar.one { background:var(--green); }
  .bar.unresolved { background:var(--red); }
  .bar .n { position:absolute; top:-16px; width:100%; text-align:center; font-size:10px; color:var(--ink); }
  .bar .r { position:absolute; bottom:-16px; width:100%; text-align:center; font-size:9px; color:var(--dim2); }
  #runmeta { margin-top:22px; font-size:11px; color:var(--dim2); }
  #log { flex:1; overflow-y:auto; font-size:11px; }
  #log div { padding:1px 0; color:var(--dim2); }
  #log div b { color:var(--ink); font-weight:600; }
  #log .ok { color:var(--green); } #log .fail { color:var(--red); } #log .think { color:var(--cyan); }
  #edges pre { font-size:10px; color:var(--dim2); white-space:pre-wrap; word-break:break-all; }
  #report pre { font-size:10px; color:var(--ink); white-space:pre-wrap; }
  #gamebtn { background:none; border:1px solid var(--amber); color:var(--amber); font:inherit;
             padding:6px 14px; border-radius:4px; cursor:pointer; }
  #gamebtn:hover { background:rgba(255,179,71,.08); }
  #gamebtn:disabled { border-color:var(--dim2); color:var(--dim2); cursor:default; }
  #gamehint { margin-top:8px; font-size:11px; color:var(--dim2); }
  #banner { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
            pointer-events:none; }
  #banner span { font-size:26px; letter-spacing:.14em; font-weight:700; color:var(--amber);
                 background:rgba(11,14,20,.82); padding:18px 34px; border:1px solid var(--amber);
                 border-radius:6px; }
  #snitchptr { position:absolute; display:none; pointer-events:none; transform:translate(-50%,-50%);
               font-size:11px; letter-spacing:.06em; color:var(--amber); background:rgba(11,14,20,.85);
               border:1px solid var(--amber); border-radius:12px; padding:3px 10px; white-space:nowrap; }
  #hunthud { position:absolute; top:14px; right:16px; display:none; font-size:12px; color:var(--amber);
             background:rgba(11,14,20,.7); border:1px solid var(--line); border-radius:4px; padding:6px 12px;
             pointer-events:none; }
  #flightstatus { position:absolute; bottom:14px; right:16px; display:none; color:var(--cyan);
                  background:rgba(11,14,20,.7); border:1px solid var(--line); border-radius:4px;
                  padding:6px 10px; font-size:11px; pointer-events:none; }
</style>
</head>
<body>
<div id="view">
  <div id="hud"><h1>SKYRA · GLOBE</h1><div class="sub">dna-v3 on the cube-sphere, over the time kernel</div></div>
  <div id="status">connecting…</div>
  <div id="banner"><span></span></div>
  <div id="snitchptr">snitch — far side, orbit to see it</div>
  <div id="hunthud"></div>
  <div id="flightstatus"></div>
</div>
<div id="panel">
  <section>
    <select id="reps"><option>3</option><option selected>5</option><option>8</option><option>12</option></select>
    <button id="runbtn">run episodes</button>
    <div id="runmeta">target: beacon:/ status lit</div>
  </section>
  <section>
    <button id="gamebtn">⚡ seeker duel</button>
    <div id="gamehint">you vs skyra, first to catch the snitch.<br>bank: A/D · throttle: W/S · set course: click · catch: SPACE<br>
    <label style="cursor:pointer"><input type="checkbox" id="seekerchk" checked> over-shoulder seeker cam</label></div>
  </section>
  <section><h2>passes to closure</h2><div id="bars"></div></section>
  <section id="report" style="display:none"><h2>report</h2><pre></pre></section>
  <section id="edges" style="display:none"><h2>edges learned</h2><pre></pre></section>
  <section style="flex:1;display:flex;flex-direction:column;min-height:0"><h2>world</h2><div id="log"></div></section>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const statusEl = document.getElementById('status');
const view = document.getElementById('view');

const mesh = await (await fetch('/mesh')).json();
const N = mesh.n, cells = mesh.cells;
const index = new Map(cells.map((c, i) => [c.id, i]));

// ── scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(2.6, 1.6, 2.6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.6; controls.maxDistance = 8;

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.5); sun.position.set(4, 6, 3); scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd4ff, 0.5); fill.position.set(-4, -2, -3); scene.add(fill);

// dark turf underlayer fills the seams between tiles
scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.985, 48, 48),
  new THREE.MeshStandardMaterial({ color: 0x122a18, roughness: 1 })));

// night sky
{
  const starGeo = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i < 600; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(24 + Math.random() * 6);
    pts.push(v.x, v.y, v.z);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x9fb0d8, size: 0.05, sizeAttenuation: true })));
}

// ── cell tiles ───────────────────────────────────────────────────────────────
const tileSize = 1.55 / N;
const tileGeo = new THREE.PlaneGeometry(tileSize, tileSize);
const tileMat = new THREE.MeshStandardMaterial({ vertexColors: false, roughness: 0.85, metalness: 0.05 });
const tiles = new THREE.InstancedMesh(tileGeo, tileMat, cells.length);
tiles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
// quidditch turf: mowed-lawn stripes, with a whisper of per-face variation so you can
// still read where the cube seams run
const grassA = new THREE.Color(0x3a8a46), grassB = new THREE.Color(0x2f7439);
const faceShade = [1.0, 0.94, 1.04, 0.9, 1.08, 0.86];
const baseColors = [];
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), zAxis = new THREE.Vector3(0, 0, 1);
  const pos = new THREE.Vector3(), scale = new THREE.Vector3(1, 1, 1);
  cells.forEach((c, i) => {
    pos.set(c.p[0], c.p[1], c.p[2]);
    q.setFromUnitVectors(zAxis, pos.clone().normalize());
    m.compose(pos, q, scale);
    tiles.setMatrixAt(i, m);
    const [, cx] = c.id.split(',').map(Number);
    const col = (cx % 2 === 0 ? grassA : grassB).clone().multiplyScalar(faceShade[c.f]);
    baseColors.push(col);
    tiles.setColorAt(i, col);
  });
}
tiles.instanceColor.setUsage(THREE.DynamicDrawUsage);
scene.add(tiles);

// ── landmarks ────────────────────────────────────────────────────────────────
function surface(cellID, lift = 0) {
  const c = cells[index.get(cellID)];
  return new THREE.Vector3(c.p[0], c.p[1], c.p[2]).multiplyScalar(1 + lift);
}
function orientOut(obj, cellID) {
  const nrm = surface(cellID).normalize();
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), nrm);
}
const shrine = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.16, 5),
  new THREE.MeshStandardMaterial({ color: 0x2ea36b, emissive: 0x1d7a4d, emissiveIntensity: 0.6 }));
shrine.position.copy(surface(mesh.shrine, 0.05)); orientOut(shrine, mesh.shrine); scene.add(shrine);

const beaconMat = new THREE.MeshStandardMaterial({ color: 0x8a6a30, emissive: 0x000000 });
const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.03, 0.22, 8), beaconMat);
beacon.position.copy(surface(mesh.beacon, 0.08)); orientOut(beacon, mesh.beacon); scene.add(beacon);
const beaconLight = new THREE.PointLight(0xffb347, 0, 1.2);
beaconLight.position.copy(surface(mesh.beacon, 0.16)); scene.add(beaconLight);
function setLit(lit) {
  beaconMat.emissive.setHex(lit ? 0xffb347 : 0x000000);
  beaconMat.emissiveIntensity = lit ? 1.4 : 0;
  beaconLight.intensity = lit ? 2.2 : 0;
}
setLit(mesh.lit);
// the beacon experiment's furniture only belongs on the pitch during beacon runs
function showQuestFurniture(show) {
  shrine.visible = show; beacon.visible = show;
  if (!show) beaconLight.intensity = 0;
}

// ── goal hoops: three golden rings on poles at each end of the pitch ─────────
const brass = new THREE.MeshStandardMaterial({ color: 0xd4a938, emissive: 0x6b5210, emissiveIntensity: 0.35, metalness: 0.7, roughness: 0.35 });
function addHoops(cellID) {
  const nrm = surface(cellID).normalize();
  // a tangent frame on the surface, to spread the three hoops side by side
  const ref = Math.abs(nrm.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  const tan = new THREE.Vector3().crossVectors(nrm, ref).normalize();
  [-1, 0, 1].forEach((k, j) => {
    const h = [0.16, 0.24, 0.19][j];
    const basePos = surface(cellID).addScaledVector(tan, k * 0.085);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, h, 6), brass);
    pole.position.copy(basePos).addScaledVector(nrm, h / 2);
    pole.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), nrm);
    scene.add(pole);
    const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.036, 0.006, 8, 24), brass);
    hoop.position.copy(basePos).addScaledVector(nrm, h + 0.03);
    hoop.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan); // ring faces across the pitch
    scene.add(hoop);
  });
  const glow = new THREE.PointLight(0xffe9b0, 0.9, 0.9);
  glow.position.copy(surface(cellID, 0.22)); scene.add(glow);
}
addHoops(`0,${Math.floor(N / 2)},${Math.floor(N / 2)}`);
addHoops(`1,${Math.floor(N / 2) - 1},${Math.floor(N / 2) - 1}`);

// ── riders ───────────────────────────────────────────────────────────────────
// wizards from primitives — robe, head, hat, broom — because a self-contained page
// beats a beautiful asset pipeline. Scaled to the grid so they read at any -face.
const WIZ = 2.1 / N; // one wizard-unit
function buildWizard(robeColor, trimColor) {
  const g = new THREE.Group();
  const robeMat = new THREE.MeshStandardMaterial({ color: robeColor, roughness: 0.8 });
  const trimMat = new THREE.MeshStandardMaterial({ color: trimColor, emissive: trimColor, emissiveIntensity: 0.5 });
  const robe = new THREE.Mesh(new THREE.ConeGeometry(0.3 * WIZ, 0.9 * WIZ, 8), robeMat);
  robe.position.y = 0.45 * WIZ; g.add(robe);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16 * WIZ, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0xe8cfae, roughness: 0.9 }));
  head.position.y = 1.0 * WIZ; g.add(head);
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.2 * WIZ, 0.5 * WIZ, 8), robeMat);
  hat.position.y = 1.3 * WIZ; g.add(hat);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.17 * WIZ, 0.035 * WIZ, 6, 12), trimMat);
  band.rotation.x = Math.PI / 2; band.position.y = 1.1 * WIZ; g.add(band);
  const broomMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.9 });
  const broom = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * WIZ, 0.035 * WIZ, 1.5 * WIZ, 6), broomMat);
  broom.rotation.x = Math.PI / 2; broom.position.set(0, 0.18 * WIZ, 0.1 * WIZ); g.add(broom);
  const bristles = new THREE.Mesh(new THREE.ConeGeometry(0.11 * WIZ, 0.4 * WIZ, 8),
    new THREE.MeshStandardMaterial({ color: 0xc9a55a, roughness: 1 }));
  bristles.rotation.x = -Math.PI / 2; bristles.position.set(0, 0.18 * WIZ, 0.95 * WIZ); g.add(bristles);
  return g;
}
function buildSnitch() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.16 * WIZ, 14, 14),
    new THREE.MeshStandardMaterial({ color: 0xffd24a, emissive: 0xffb300, emissiveIntensity: 2.0, metalness: 0.6, roughness: 0.3 }));
  g.add(body);
  const wingMat = new THREE.MeshBasicMaterial({ color: 0xfff3d0, transparent: true, opacity: 0.75, side: THREE.DoubleSide });
  const wingGeo = new THREE.PlaneGeometry(0.5 * WIZ, 0.16 * WIZ);
  const wL = new THREE.Mesh(wingGeo, wingMat); wL.position.x = -0.34 * WIZ; g.add(wL);
  const wR = new THREE.Mesh(wingGeo, wingMat); wR.position.x = 0.34 * WIZ; g.add(wR);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.34 * WIZ, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffd24a, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
  g.add(halo);
  g.add(new THREE.PointLight(0xffd24a, 1.2, 0.6));
  return { g, wings: [wL, wR], halo };
}

const agents = new Map(); // id → {mesh, from, to, t0, dur, lift, heading, wings, halo}
function agentMarker(id, cellID) {
  let m, wings = null, halo = null, lift = 0.008;
  if (id === 'snitch') {
    const s = buildSnitch(); m = s.g; wings = s.wings; halo = s.halo; lift = 0.05;
  } else if (id === 'you') {
    m = buildWizard(0x3d5a80, 0x69d58c);
  } else if (id === 'skyra') {
    m = buildWizard(0x2b2d42, 0x4fd8eb);
  } else {
    m = new THREE.Mesh(new THREE.SphereGeometry(0.024, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0x8892aa, emissive: 0x333a4d }));
    lift = 0.03;
  }
  m.position.copy(surface(cellID, lift));
  scene.add(m);
  agents.set(id, {
    mesh: m, from: m.position.clone(), to: m.position.clone(), t0: 0, dur: 1,
    lift, wings, halo, heading: new THREE.Vector3(1, 0, 0), bank: 0, bankTarget: 0,
  });
}
Object.entries(mesh.agents).forEach(([id, cell]) => agentMarker(id, cell));
function moveAgent(id, cellID, ms) {
  const a = agents.get(id); if (!a) { agentMarker(id, cellID); return; }
  const dest = surface(cellID, a.lift);
  const dir = dest.clone().sub(a.mesh.position);
  if (dir.lengthSq() > 1e-10) {
    const next = dir.normalize();
    const up = a.mesh.position.clone().normalize();
    const turn = up.dot(new THREE.Vector3().crossVectors(a.heading, next));
    a.bankTarget = THREE.MathUtils.clamp(-turn * 3.5, -0.55, 0.55);
    a.heading.copy(next); // riders face where the server says they flew
  }
  a.from.copy(a.mesh.position); a.to.copy(dest);
  a.t0 = performance.now(); a.dur = ms;
}
// stand a rider on the sphere: feet out of the turf, nose along its heading
const _up = new THREE.Vector3(), _m4 = new THREE.Matrix4(), _zero = new THREE.Vector3();
function orientRider(a) {
  _up.copy(a.mesh.position).normalize();
  const fwd = a.heading.clone().addScaledVector(_up, -a.heading.dot(_up));
  if (fwd.lengthSq() < 1e-8) return;
  fwd.normalize();
  _m4.lookAt(_zero, fwd, _up);
  a.mesh.quaternion.setFromRotationMatrix(_m4);
  a.mesh.rotateZ(a.bank);
}

// ── perceive ripple ──────────────────────────────────────────────────────────
// each flash: {i, at} — tile i starts flashing at time `at`, pulses ~700ms
let flashes = [];
function ripple(distances) {
  const now = performance.now();
  for (const [cellID, d] of Object.entries(distances)) {
    const i = index.get(cellID);
    if (i !== undefined) flashes.push({ i, at: now + d * 55 });
  }
}
const flashColor = new THREE.Color(0x4fd8eb), tmpColor = new THREE.Color();
function animateFlashes(now) {
  if (!flashes.length) return;
  const alive = [];
  const touched = new Set();
  for (const f of flashes) {
    const t = (now - f.at) / 700;
    if (t < 1) { alive.push(f); if (t >= 0) touched.add(f.i); }
    else touched.add(f.i);
  }
  for (const f of flashes) {
    const t = (now - f.at) / 700;
    if (t < 0 || t >= 1) continue;
    const k = Math.sin(t * Math.PI) * 0.9;
    tmpColor.copy(baseColors[f.i]).lerp(flashColor, k);
    tiles.setColorAt(f.i, tmpColor);
  }
  // restore finished tiles
  for (const f of flashes) {
    if ((now - f.at) / 700 >= 1) tiles.setColorAt(f.i, baseColors[f.i]);
  }
  flashes = alive;
  tiles.instanceColor.needsUpdate = true;
}

// ── panel ────────────────────────────────────────────────────────────────────
const bars = document.getElementById('bars'), logEl = document.getElementById('log');
const runbtn = document.getElementById('runbtn'), repsEl = document.getElementById('reps');
const runmeta = document.getElementById('runmeta');
function logLine(html, cls) {
  const d = document.createElement('div'); if (cls) d.className = cls;
  d.innerHTML = html; logEl.appendChild(d);
  while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
function addBar(run, passes, status) {
  const b = document.createElement('div');
  b.className = 'bar' + (status !== 'closed' ? ' unresolved' : passes === 1 ? ' one' : '');
  b.style.height = Math.max(10, passes * 13) + 'px';
  b.innerHTML = `<span class="n">${passes}</span><span class="r">${run}</span>`;
  bars.appendChild(b);
}
runbtn.onclick = async () => {
  runbtn.disabled = true;
  bars.innerHTML = '';
  document.getElementById('report').style.display = 'none';
  document.getElementById('edges').style.display = 'none';
  await fetch('/run?reps=' + repsEl.value, { method: 'POST' }).catch(() => {});
};

// ── seeker duel ──────────────────────────────────────────────────────────────
const gamebtn = document.getElementById('gamebtn');
const banner = document.getElementById('banner'), bannerText = banner.querySelector('span');
let gameOn = false;
gamebtn.onclick = async () => {
  gamebtn.disabled = true; runbtn.disabled = true;
  await fetch('/game/start', { method: 'POST' }).catch(() => {});
};
function showBanner(text, ms) {
  bannerText.textContent = text;
  banner.style.display = 'flex';
  if (ms) setTimeout(() => { banner.style.display = 'none'; }, ms);
}

// Flying remains world-authored: controls change a heading, but only server step events
// move the rendered rider.
let myCell = null; // tracked from game start + step events
function setCourse(cellID) {
  const i = index.get(cellID);
  if (i !== undefined) flashes.push({ i, at: performance.now() });
  flight.course = cellID;
  statusEl.innerHTML = `<b>course set</b> → ${cellID}`;
}

// click-to-fly: a genuine click (not an orbit drag) on a tile sends you there
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!gameOn || !downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 6) return; // that was an orbit, not a click
  const rect = renderer.domElement.getBoundingClientRect();
  ptr.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  ptr.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(tiles)[0];
  if (hit && hit.instanceId !== undefined) setCourse(cells[hit.instanceId].id);
});

// ── broom flight: always drifting, banking, a touch sluggish — that's the sport ──────
// The client steers a HEADING and a THROTTLE; every beat it asks the server to walk
// toward the cell ahead of the broom. The wizard you see renders at server-confirmed
// position only — screen-truth stays glued to world-truth (we learned that the hard way).
const flight = {
  heading: 0, speed: 2.2, targetSpeed: 2.2, min: 1.35, max: 5.0,
  turnRate: 0, maxTurn: 2.25, course: null,
}; // tiles/sec, rad/sec
const keys = new Set();
addEventListener('keydown', (e) => {
  if (!gameOn) return;
  if (e.code === 'Space') { e.preventDefault(); fetch('/player/catch', { method: 'POST' }).catch(() => {}); return; }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(e.code)) {
    e.preventDefault(); keys.add(e.code);
  }
});
addEventListener('keyup', (e) => keys.delete(e.code));

// tangent frame at a point on the sphere (east/north relative to world +Y)
const _e = new THREE.Vector3(), _n = new THREE.Vector3(), _p = new THREE.Vector3(), _d = new THREE.Vector3();
function headingDirAt(pos) {
  _p.copy(pos).normalize();
  _e.set(0, 1, 0).cross(_p);
  if (_e.lengthSq() < 1e-6) _e.set(1, 0, 0).cross(_p);
  _e.normalize();
  _n.copy(_p).cross(_e).normalize();
  return _d.copy(_e).multiplyScalar(Math.cos(flight.heading)).addScaledVector(_n, Math.sin(flight.heading)).normalize();
}
function steer(dt) {
  const left = keys.has('ArrowLeft') || keys.has('KeyA');
  const right = keys.has('ArrowRight') || keys.has('KeyD');
  let turnInput = (left ? 1 : 0) - (right ? 1 : 0);
  if (turnInput) flight.course = null; // direct steering takes the broom back

  const me = agents.get('you');
  if (!turnInput && flight.course && me) {
    const targetCell = cells[index.get(flight.course)];
    if (targetCell) {
      const pos = me.to.clone().normalize();
      const target = new THREE.Vector3(...targetCell.p).normalize();
      const tangent = target.addScaledVector(pos, -target.dot(pos));
      if (tangent.lengthSq() > 1e-8) {
        tangent.normalize();
        _e.set(0, 1, 0).cross(pos);
        if (_e.lengthSq() < 1e-6) _e.set(1, 0, 0).cross(pos);
        _e.normalize(); _n.copy(pos).cross(_e).normalize();
        const desired = Math.atan2(tangent.dot(_n), tangent.dot(_e));
        const delta = Math.atan2(Math.sin(desired - flight.heading), Math.cos(desired - flight.heading));
        turnInput = THREE.MathUtils.clamp(delta / 0.7, -1, 1);
      }
      if (flight.course === myCell) flight.course = null;
    }
  }

  const desiredTurn = turnInput * flight.maxTurn;
  flight.turnRate += (desiredTurn - flight.turnRate) * Math.min(1, dt * 3.2);
  flight.heading += flight.turnRate * dt;

  if (keys.has('ArrowUp') || keys.has('KeyW')) flight.targetSpeed = Math.min(flight.max, flight.targetSpeed + 2.2 * dt);
  if (keys.has('ArrowDown') || keys.has('KeyS')) flight.targetSpeed = Math.max(flight.min, flight.targetSpeed - 2.8 * dt);
  flight.speed += (flight.targetSpeed - flight.speed) * Math.min(1, dt * 1.8);
}
// every beat: project the broom forward and ask the world to walk there
let lastBeat = 0;
let movePending = false;
function flightBeat(now) {
  if (now - lastBeat < 170 || movePending) return;
  lastBeat = now;
  const me = agents.get('you');
  if (!me) return;
  const dir = headingDirAt(me.to);
  const arc = (flight.speed * 0.55) * (Math.PI / 2) / N; // lookahead in radians
  const target = me.to.clone().normalize().multiplyScalar(Math.cos(arc)).addScaledVector(dir, Math.sin(arc)).normalize();
  // nearest cell to the projected point
  let best = null, bestD = 1e9;
  for (const c of cells) {
    const d = (c.p[0] - target.x) ** 2 + (c.p[1] - target.y) ** 2 + (c.p[2] - target.z) ** 2;
    if (d < bestD) { bestD = d; best = c.id; }
  }
  if (best && best !== myCell) {
    movePending = true;
    fetch('/player/move?cell=' + encodeURIComponent(best), { method: 'POST' })
      .then(r => {
        if (!r.ok && r.status !== 409) statusEl.innerHTML = `<b>move rejected</b> (${r.status})`;
      })
      .catch(() => { statusEl.innerHTML = '<b>move failed</b> — server unreachable'; })
      .finally(() => { movePending = false; });
  }
}

// rejoin a duel already in progress (page refresh mid-game)
try {
  const gs = await (await fetch('/game/state')).json();
  if (gs.active) {
    gameOn = true; gamebtn.disabled = true; runbtn.disabled = true;
    myCell = gs.agents['you'] || null;
    showQuestFurniture(false);
    statusEl.innerHTML = '<b>seeker duel</b> — rejoined';
  }
} catch {}

// ── events ───────────────────────────────────────────────────────────────────
const es = new EventSource('/events');
if (!gameOn) statusEl.textContent = 'idle — run episodes from the panel';
es.onmessage = (m) => {
  const e = JSON.parse(m.data);
  switch (e.type) {
    case 'world': {
      const w = e.event;
      if (w.kind === 'step') { moveAgent(w.agent, w.cell, 110); if (w.agent === 'you') myCell = w.cell; }
      if (w.kind === 'walk') logLine(`<b>${w.agent}</b> sets out → ${w.cell} (${w.extra.steps} steps)`);
      if (w.kind === 'arrive') logLine(`<b>${w.agent}</b> arrives at ${w.cell}`);
      if (w.kind === 'perceive') { ripple(w.extra.distances); logLine(`<b>${w.agent}</b> perceives — the wave runs`, 'think'); }
      if (w.kind === 'take') logLine(w.extra.ok ? `<b>${w.agent}</b> takes the sigil` : `take fails — missing ${w.extra.missing}`, w.extra.ok ? 'ok' : 'fail');
      if (w.kind === 'activate') {
        if (w.extra.ok) { setLit(true); logLine(`<b>${w.agent}</b> lights the beacon`, 'ok'); }
        else logLine(`activate fails — missing ${w.extra.missing}`, 'fail');
      }
      if (w.kind === 'catch') {
        if (w.extra.ok) logLine(`<b>${w.agent}</b> CATCHES THE SNITCH`, 'ok');
        else logLine(`<b>${w.agent}</b> swipes and misses — ${w.extra.missing}`, 'fail');
      }
      break;
    }
    case 'game': {
      if (e.phase === 'start') {
        gameOn = true;
        myCell = e.you;
        showQuestFurniture(false); // the pitch is for the duel now
        ['you', 'snitch'].forEach(id => { if (!agents.has(id)) agentMarker(id, e[id]); else moveAgent(id, e[id], 200); });
        moveAgent('skyra', e.skyra, 200);
        statusEl.innerHTML = '<b>seeker duel</b> — the snitch is loose';
        showBanner('THE SNITCH IS LOOSE', 1600);
        logLine('— seeker duel —');
      }
      if (e.phase === 'over') {
        gameOn = false; gamebtn.disabled = false; runbtn.disabled = false;
        snitchptr.style.display = 'none';
        camera.up.set(0, 1, 0); controls.enabled = true; keys.clear();
        const won = e.winner === 'you';
        showBanner(won ? '🏆 YOU CAUGHT THE SNITCH' : `${e.winner.toUpperCase()} CAUGHT THE SNITCH`);
        setTimeout(() => { banner.style.display = 'none'; }, 5000);
        statusEl.innerHTML = `<b>duel over</b> — caught by ${e.winner}`;
      }
      break;
    }
    case 'hunt':
      logLine(`skyra replans: passes=${e.passes} acts=${e.acts}`, 'think');
      break;
    case 'infer': statusEl.innerHTML = `<b>thinking</b> — inference call ${e.call}`; break;
    case 'episode': setLit(false); showQuestFurniture(true); statusEl.innerHTML = `<b>episode ${e.run}</b> — fresh world, same memory`; logLine(`— episode ${e.run} —`); break;
    case 'run': {
      addBar(e.run, e.passes, e.status);
      runmeta.textContent = `run ${e.run}: passes=${e.passes} acts=${e.acts} bets=${e.bets} correct=${e.correct} edge=${e.edge.toFixed(3)}`;
      logLine(`run ${e.run}: passes=<b>${e.passes}</b> acts=${e.acts} ${e.status}`, e.status === 'closed' ? 'ok' : 'fail');
      break;
    }
    case 'target': runmeta.textContent = 'target: ' + e.triples.join(', '); break;
    case 'report': {
      statusEl.innerHTML = '<b>done</b>';
      runbtn.disabled = false;
      const r = document.getElementById('report'); r.style.display = ''; r.querySelector('pre').textContent = e.text;
      const ed = document.getElementById('edges'); ed.style.display = ''; ed.querySelector('pre').textContent = (e.edges || []).join('\n');
      break;
    }
    case 'error': statusEl.innerHTML = `<b>error</b> — ${e.err}`; runbtn.disabled = false; break;
  }
};
es.onerror = () => { statusEl.textContent = 'connection lost — is the server running?'; };

// ── loop ─────────────────────────────────────────────────────────────────────
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
resize(); addEventListener('resize', resize);
const snitchptr = document.getElementById('snitchptr');
const hunthud = document.getElementById('hunthud');
const flightstatus = document.getElementById('flightstatus');
const seekerchk = document.getElementById('seekerchk');
seekerchk.addEventListener('change', () => { if (!seekerchk.checked) camera.up.set(0, 1, 0); });
const ndc = new THREE.Vector3();
// manual orbiting pauses the follow-cam briefly so the two never fight
let followPauseUntil = 0;
controls.addEventListener('start', () => { followPauseUntil = performance.now() + 2500; });
let lastFrame = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
  lastFrame = now;
  for (const [id, a] of agents) {
    if (a.t0) {
      const t = Math.min(1, (now - a.t0) / a.dur);
      a.mesh.position.lerpVectors(a.from, a.to, t);
      a.mesh.position.normalize().multiplyScalar(1 + a.lift);
      if (t >= 1) a.t0 = 0;
    }
    if (id === 'you') a.bankTarget = THREE.MathUtils.clamp(-flight.turnRate * 0.24, -0.55, 0.55);
    else a.bankTarget *= 0.94;
    a.bank += (a.bankTarget - a.bank) * Math.min(1, dt * 6);
    orientRider(a);
    if (a.wings) { // the snitch beats its wings
      a.wings[0].rotation.y = 0.9 * Math.sin(now / 45) + 0.5;
      a.wings[1].rotation.y = -0.9 * Math.sin(now / 45) - 0.5;
    }
    if (a.halo) {
      a.halo.scale.setScalar(1 + 0.3 * Math.sin(now / 130));
    }
  }
  // broom flight + over-shoulder cam
  const me = agents.get('you');
  if (gameOn && me) {
    steer(dt);
    flightBeat(now);
    flightstatus.style.display = 'block';
    flightstatus.textContent = `${flight.speed.toFixed(1)} tiles/s${flight.course ? ` · course ${flight.course}` : ' · free flight'}`;
    camera.fov += (56 - camera.fov) * Math.min(1, dt * 5);
    camera.updateProjectionMatrix();
    if (seekerchk.checked) {
      controls.enabled = false;
      const up = me.mesh.position.clone().normalize();
      const fwd = headingDirAt(me.mesh.position).clone();
      const camPos = me.mesh.position.clone().addScaledVector(up, 0.16).addScaledVector(fwd, -0.34);
      camera.position.lerp(camPos, 0.12);
      camera.up.copy(up);
      camera.lookAt(me.mesh.position.clone().addScaledVector(fwd, 0.42).addScaledVector(up, 0.04));
    } else if (now > followPauseUntil) {
      controls.enabled = true;
      const r = camera.position.length();
      const dir = camera.position.clone().normalize()
        .lerp(me.mesh.position.clone().normalize(), 0.045).normalize();
      camera.position.copy(dir.multiplyScalar(r));
    } else {
      controls.enabled = true;
    }
  } else {
    controls.enabled = true;
    flightstatus.style.display = 'none';
    camera.fov += (42 - camera.fov) * Math.min(1, dt * 5);
    camera.updateProjectionMatrix();
  }
  // far-side pointer + distance HUD: the pointer is UI, not the snitch — it says so
  const sn = agents.get('snitch');
  if (gameOn && sn) {
    const behindGlobe = sn.mesh.position.clone().normalize()
      .dot(camera.position.clone().normalize()) < 0.05;
    if (behindGlobe) {
      ndc.copy(sn.mesh.position).project(camera);
      const rect = renderer.domElement.getBoundingClientRect();
      const x = Math.max(80, Math.min(rect.width - 80, (ndc.x * 0.5 + 0.5) * rect.width));
      const y = Math.max(24, Math.min(rect.height - 24, (-ndc.y * 0.5 + 0.5) * rect.height));
      snitchptr.style.left = x + 'px';
      snitchptr.style.top = y + 'px';
      snitchptr.style.display = 'block';
      snitchptr.style.opacity = 0.55 + 0.3 * Math.sin(now / 200);
    } else {
      snitchptr.style.display = 'none';
    }
    if (me) { // distance in tiles (one face is 90° across N cells) + bearing off my nose
      const meDir = me.mesh.position.clone().normalize();
      const snDir = sn.mesh.position.clone().normalize();
      const ang = Math.acos(Math.max(-1, Math.min(1, meDir.dot(snDir))));
      const dTiles = Math.round(ang / (Math.PI / 2) * N);
      const toSn = snDir.clone().addScaledVector(meDir, -snDir.dot(meDir));
      let bearing = '';
      if (toSn.lengthSq() > 1e-8) {
        const fwd = headingDirAt(me.mesh.position);
        toSn.normalize();
        const cosb = Math.max(-1, Math.min(1, fwd.dot(toSn)));
        const leftness = meDir.dot(new THREE.Vector3().crossVectors(fwd, toSn));
        const b = Math.acos(cosb);
        bearing = b < 0.45 ? '↑ ahead' : b > 2.6 ? '↓ behind' : (leftness > 0 ? '↰ left' : '↱ right');
      }
      hunthud.textContent = dTiles <= 1 ? `snitch ~${dTiles} — SWIPE!` : `snitch ~${dTiles} tiles ${bearing}`;
      hunthud.style.display = 'block';
      hunthud.style.color = dTiles <= 1 ? '#ffe082' : '';
    }
  } else {
    hunthud.style.display = 'none';
  }
  animateFlashes(now);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
